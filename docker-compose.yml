version: '3.8'

services:
  db:
    image: postgres:15
    container_name: factchecker_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: factchecker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./db/migrations/:/docker-entrypoint-initdb.d/migrations/

volumes:
  postgres_data:
