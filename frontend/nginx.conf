# Configuração do nginx para servir o SPA e encaminhar chamadas à API.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # O Dockerfile substitui BACKEND_URL ao iniciar o container.
    set $backend "${BACKEND_URL}";
    resolver 127.0.0.11 ipv6=off valid=30s;

    # Encaminha endpoints da API ao serviço backend sem alterar os caminhos.
    location = /api {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Encaminha o health check do backend.
    location = /health {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rotas do cliente React Router retornam ao documento principal do SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
